<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFF3DC">
<meta name="format-detection" content="telephone=no">
<title>〈要不要喝ㄋㄟㄋㄟ〉 送給萌萌和阿肥</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"HuninnSub";src:url("huninn-sub.woff2") format("woff2");font-display:swap}
:root{
  --cream:#FFF6E3; --cream2:#FBE4B8; --gold:#E2B04B; --gold-l:#F4D07D; --gold-d:#B07E28; --ink:#5E3E1E; --soft:#8C6A44; --pink:#F0A096;
  --sans:"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Source Han Sans TC",system-ui,-apple-system,sans-serif;
  --cute:"HuninnSub","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --vh:100vh;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 90% at 50% 30%,#FFFBF0 0%,#FBE9C4 100%) fixed;background-color:var(--cream);min-height:100vh;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* ================= COVER ================= */
#cover{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(110% 80% at 50% 40%,#FFFDF5 0%,#FDEBC6 70%,#F8D99C 100%);cursor:pointer;transition:opacity .9s ease,transform .9s ease;overflow:hidden;user-select:none;-webkit-user-select:none}
#cover.done{opacity:0;transform:scale(1.04);pointer-events:none}
.cv-top{font-family:var(--cute);text-align:center;color:var(--gold-d);font-size:19px;line-height:1.7;letter-spacing:.08em;margin-bottom:6px;transition:opacity .6s}
.cv-top b{display:block;font-weight:400;color:var(--ink);font-size:25px;letter-spacing:.06em}
#gift{width:min(88vw,370px);height:auto;overflow:visible;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes idle{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(-1.6deg)}40%{transform:rotate(1.6deg) translateY(-3px)}60%{transform:rotate(-1deg)}80%{transform:rotate(.6deg)}}
.cv-hint{font-family:var(--cute);color:var(--gold-d);font-size:18px;letter-spacing:.12em;margin-top:8px;animation:pulse 1.8s ease-in-out infinite;transition:opacity .4s}
.cv-hint i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:10px;vertical-align:1px;box-shadow:0 0 0 0 rgba(226,176,75,.6);animation:ring 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(226,176,75,.6)}100%{box-shadow:0 0 0 14px rgba(226,176,75,0)}}
#cover.opening .cv-hint,#cover.opening .cv-top{opacity:0;animation:none}
#cover.opening #gift{animation:none}
#cover.opening #gift{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(8px) scale(1.03,.96)}100%{transform:translateY(0) scale(1)}}
/* gift pieces */
#gift g,#gift ellipse,#gift rect,#gift path{transform-box:fill-box}
#gift .rib-l,#gift .rib-r,#gift .loopL,#gift .loopR,#gift .tailL,#gift .tailR,#gift .knot,#gift #lid,#gift .bird{transition:transform 1s cubic-bezier(.5,0,.3,1),opacity .8s ease}
#gift .loopL,#gift .loopR,#gift .tailL,#gift .tailR,#gift .knot{transform-origin:center}
#gift.open .rib-l{transform:translateX(-46px);opacity:0}
#gift.open .rib-r{transform:translateX(46px);opacity:0}
#gift.open .loopL{transform:translate(-40px,-6px) rotate(-60deg) scale(.45);opacity:0}
#gift.open .loopR{transform:translate(40px,-6px) rotate(60deg) scale(.45);opacity:0}
#gift.open .tailL{transform:translate(-50px,56px) rotate(55deg);opacity:0}
#gift.open .tailR{transform:translate(50px,56px) rotate(-55deg);opacity:0}
#gift.open .knot{transform:scale(.1);opacity:0}
#gift.open #lid{transform:translate(-44px,-190px) rotate(-24deg);opacity:0;transition-delay:.55s,.9s;transition-duration:1.1s,.5s}
#gift .bird{transform:translateY(62px)}
#gift.open .bird{transform:translateY(-6px);transition-delay:1.2s;transition-duration:.6s;transition-timing-function:cubic-bezier(.3,1.6,.5,1)}
#gift.open .bird.b2{transition-delay:1.32s}
#burst{opacity:0;transform:scale(.2);transform-origin:50% 50%;transform-box:fill-box}
#gift.open #burst{animation:burst 1.6s ease-out .55s forwards}
@keyframes burst{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:.0;transform:scale(2.3)}}
.pt{position:absolute;width:16px;height:16px;pointer-events:none;background-size:contain;background-repeat:no-repeat;z-index:3}

/* ================= MAIN ================= */
#app{opacity:0;transition:opacity .9s ease .2s;position:relative}
#app.show{opacity:1}
.stage{height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.top{text-align:center;flex:none}
.hero{width:78px;height:78px;margin:0 auto 6px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 6px 16px rgba(176,126,40,.28)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;display:block}
.eyebrow{margin:2px 0 0;font-family:var(--cute);color:var(--gold-d);font-size:15px;letter-spacing:.14em}
h1.title{margin:2px 0 10px;font-family:var(--cute);font-weight:400;font-size:clamp(23px,7.3vw,32px);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.toggle{display:inline-flex;background:rgba(255,255,255,.7);border:2px solid var(--gold);border-radius:999px;padding:3px;gap:2px}
.toggle button{font-family:var(--cute);font-size:16px;padding:7px 22px;border-radius:999px;color:var(--gold-d);letter-spacing:.08em;transition:background .25s,color .25s}
.toggle button[aria-pressed="true"]{background:linear-gradient(180deg,#F7D77F,#E2B04B);color:#5b3b12;box-shadow:0 2px 6px rgba(176,126,40,.35)}
.lyrics{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:10px -6px 4px;padding:90px 6px 110px;text-align:center;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent 0,#000 16%,#000 84%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 16%,#000 84%,transparent 100%)}
.lyrics::-webkit-scrollbar{display:none}
.sec{display:inline-block;margin:22px 0 8px;padding:3px 16px;border:2px solid var(--gold);border-radius:999px;background:#FDEEC8;color:var(--gold-d);font-family:var(--cute);font-size:13px;letter-spacing:.12em}
.sec-w{display:block;text-align:center}
.ln{margin:0;padding:7px 8px;font-size:18px;line-height:1.55;color:#B79A74;border-radius:14px;transition:color .35s,transform .35s,background .35s;cursor:pointer;transform-origin:50% 50%}
.ln.past{color:#A98E6A}
.ln.on{color:#4B2D0E;font-weight:700;font-size:20px;background:linear-gradient(90deg,rgba(244,208,125,0),rgba(244,208,125,.55) 20%,rgba(244,208,125,.55) 80%,rgba(244,208,125,0));transform:scale(1.03)}
.player{flex:none;display:flex;align-items:center;gap:14px;padding:10px 4px 2px}
#play{flex:none;width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,#F8DA86,#E0AC45);box-shadow:0 6px 14px rgba(176,126,40,.4),inset 0 2px 0 rgba(255,255,255,.55);display:grid;place-items:center}
#play svg{width:28px;height:28px;fill:#5b3b12}
#play:active{transform:scale(.95)}
.seek{flex:1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.seek span{width:36px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:28px;background:transparent;margin:0;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(90deg,var(--gold) var(--p),#F0DEB8 var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#F0DEB8}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--gold)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--gold);margin-top:-7px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--gold)}
.more{flex:none;text-align:center;font-family:var(--cute);color:var(--gold-d);font-size:13px;letter-spacing:.1em;padding:4px 0 0;opacity:.85;width:100%}
.more svg{width:14px;height:14px;vertical-align:-2px;margin-left:4px;stroke:var(--gold-d);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

section.blk{max-width:560px;margin:0 auto;padding:46px 18px 10px;text-align:center}
h2{font-family:var(--cute);font-weight:400;font-size:24px;color:var(--ink);margin:0 0 18px;letter-spacing:.14em}
h2::before,h2::after{content:"";display:inline-block;width:34px;height:2px;background:var(--gold-l);vertical-align:middle;margin:0 12px 4px}
.note{position:relative;margin:0 auto;padding:34px 26px 30px;background:#FFFCF4;border:2px solid var(--gold);border-radius:26px;box-shadow:0 10px 26px rgba(176,126,40,.2);font-size:21px;line-height:1.9;color:#4B2D0E;font-weight:600}
.note::before,.note::after{position:absolute;font-family:var(--cute);font-size:42px;color:var(--gold-l);line-height:1}
.note::before{content:"「";left:14px;top:-14px;background:#FFFCF4;padding:0 4px}.note::after{content:"」";right:14px;bottom:-26px;background:#FFFCF4;padding:0 4px}
.note p{margin:0}
.note small{display:block;margin-top:14px;font-size:13px;font-weight:400;color:var(--soft);letter-spacing:.1em}
.grid{display:flex;gap:12px;align-items:flex-start}.grid .col{flex:1;min-width:0}
.ph{display:block;width:100%;margin:0 0 12px;background:#fff;padding:7px 7px 7px;border-radius:12px;box-shadow:0 5px 14px rgba(176,126,40,.22);border:1px solid #F1DDB4;transition:transform .2s}
.ph:active{transform:scale(.97)}
.ph img{width:100%;height:auto;display:block;border-radius:7px;background:#F4E7C8}
footer{text-align:center;color:#B79A74;font-size:12px;letter-spacing:.14em;padding:34px 0 max(30px,env(safe-area-inset-bottom))}
footer span{font-family:var(--cute)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:80;background:rgba(36,22,8,.94);display:none;align-items:center;justify-content:center;touch-action:pan-y}
#lb.show{display:flex}
#lb img{max-width:100vw;max-height:84vh;max-height:84dvh;object-fit:contain;border-radius:6px;transition:opacity .2s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lb button{position:absolute;color:#FFF3DC;width:48px;height:48px;border-radius:50%;background:rgba(60,38,12,.55);border:1.5px solid rgba(255,243,220,.5);display:grid;place-items:center}
#lb button svg{width:24px;height:24px;stroke:#FFF3DC;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#lb .x{top:max(14px,env(safe-area-inset-top));right:14px}
#lb .pv{left:8px;top:50%;margin-top:-24px}#lb .nx{right:8px;top:50%;margin-top:-24px}
#lb .ct{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#F4D07D;font-size:14px;letter-spacing:.2em}
@media (prefers-reduced-motion:reduce){#gift,.cv-hint,.cv-hint i{animation:none!important}}

</style>
</head>
<body class="locked">
<noscript><p style="padding:24px;text-align:center">請開啟 JavaScript 以拆開這份禮物。</p></noscript>

<!-- ============ 拆禮物封面 ============ -->
<div id="cover" role="button" tabindex="0" aria-label="輕點，拆開禮物">
  <div class="cv-top">有一份禮物<b>送給萌萌和阿肥</b></div>
  <svg id="gift" viewBox="0 0 300 330" aria-hidden="true">
    <defs>
      <radialGradient id="bg1" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF4C8" stop-opacity="1"/><stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/></radialGradient>
      <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3C56C"/><stop offset="1" stop-color="#DCA444"/></linearGradient>
      <linearGradient id="lidg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBDB8E"/><stop offset="1" stop-color="#F1C466"/></linearGradient>
      <symbol id="birdG" viewBox="0 0 190 200"><ellipse cx="95" cy="128" rx="85" ry="72" fill="#C4D65C"/><ellipse cx="95" cy="150" rx="55" ry="50" fill="#FAF0AA"/><ellipse cx="39" cy="126" rx="31" ry="34" fill="#78AA46"/><ellipse cx="151" cy="126" rx="31" ry="34" fill="#78AA46"/><ellipse cx="95" cy="67" rx="77" ry="63" fill="#C4D65C"/><ellipse cx="45" cy="83" rx="15" ry="13" fill="#FFAAA0" opacity=".6"/><ellipse cx="145" cy="83" rx="15" ry="13" fill="#FFAAA0" opacity=".6"/><circle cx="62" cy="64" r="11" fill="#32241E"/><circle cx="128" cy="64" r="11" fill="#32241E"/><circle cx="65" cy="59" r="4" fill="#fff"/><circle cx="131" cy="59" r="4" fill="#fff"/><path d="M79 78h32l-16 28z" fill="#F4967A"/></symbol>
      <symbol id="birdB" viewBox="0 0 190 200"><ellipse cx="95" cy="128" rx="85" ry="72" fill="#C4D0DE"/><ellipse cx="95" cy="150" rx="55" ry="50" fill="#F6F6F8"/><ellipse cx="39" cy="126" rx="31" ry="34" fill="#8CAAC8"/><ellipse cx="151" cy="126" rx="31" ry="34" fill="#8CAAC8"/><ellipse cx="95" cy="67" rx="77" ry="63" fill="#C4D0DE"/><ellipse cx="45" cy="83" rx="15" ry="13" fill="#FFAAA0" opacity=".6"/><ellipse cx="145" cy="83" rx="15" ry="13" fill="#FFAAA0" opacity=".6"/><circle cx="62" cy="64" r="11" fill="#32241E"/><circle cx="128" cy="64" r="11" fill="#32241E"/><circle cx="65" cy="59" r="4" fill="#fff"/><circle cx="131" cy="59" r="4" fill="#fff"/><path d="M79 78h32l-16 28z" fill="#F4967A"/></symbol>
    </defs>
    <circle id="burst" cx="150" cy="150" r="120" fill="url(#bg1)"/>

    <!-- birds hide behind the box until it opens -->
    <g class="bird b1"><use href="#birdG" x="52" y="104" width="78" height="82"/></g>
    <g class="bird b2"><use href="#birdB" x="170" y="104" width="78" height="82"/></g>
    <!-- box body -->
    <rect x="45" y="170" width="210" height="128" rx="14" fill="url(#bodyg)"/>
    <g fill="#FFEBBE" opacity=".8"><circle cx="72" cy="200" r="4"/><circle cx="100" cy="240" r="4"/><circle cx="72" cy="272" r="4"/><circle cx="204" cy="200" r="4"/><circle cx="228" cy="240" r="4"/><circle cx="204" cy="274" r="4"/></g>
    <rect class="rib-l" x="132" y="170" width="18" height="128" fill="#FFFAEE"/><rect class="rib-r" x="150" y="170" width="18" height="128" fill="#FFFAEE"/>
    <rect class="rib-l" x="132" y="170" width="3" height="128" fill="#EADCC0"/><rect class="rib-r" x="165" y="170" width="3" height="128" fill="#EADCC0"/>
    <!-- lid -->
    <g id="lid">
      <rect x="34" y="132" width="232" height="46" rx="12" fill="url(#lidg)"/>
      <rect x="34" y="164" width="232" height="14" rx="8" fill="#E8B85C"/>
      <rect x="44" y="138" width="212" height="7" rx="3.5" fill="#FFF0C4" opacity=".7"/>
      <rect class="rib-l" x="132" y="132" width="18" height="46" fill="#FFFAEE"/><rect class="rib-r" x="150" y="132" width="18" height="46" fill="#FFFAEE"/>
      <g transform="translate(150,126)">
        <path class="tailL" d="M-4 6l-22 56 14-5 6 12 16-52z" fill="#FFFAEE" stroke="#EADCC0" stroke-width="2" stroke-linejoin="round"/>
        <path class="tailR" d="M4 6l22 56-14-5-6 12-16-52z" fill="#FFFAEE" stroke="#EADCC0" stroke-width="2" stroke-linejoin="round"/>

  </svg>
  <div class="cv-hint"><i></i>輕點，拆開禮物</div>
</div>

<!-- ============ 歌曲頁 ============ -->
<div id="app" aria-hidden="true">
  <section class="stage">
    <header class="top">
      <div class="hero"><img src="hero.jpg" alt="手繪風插畫" width="78" height="78"></div>
      <p class="eyebrow">送給萌萌和阿肥</p>
      <h1 class="title">〈要不要喝ㄋㄟㄋㄟ〉</h1>
      <div class="toggle" role="group" aria-label="選擇版本">
        <button type="button" data-v="male" aria-pressed="true">男聲版</button>

<script>
